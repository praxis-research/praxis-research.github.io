<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 295" aria-label="Dumbbell chart: B-fraction for prompt and SDF methods across five models. All open-weight models are performative-dominant. Claude 3 Opus is scheming-dominant." width="520" height="295">
<style>
:root {
  --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --bg:       #ffffff;
  --surface:  #f4f6f8;   
  --ink:      #1a1d21;   
  --heading:  #0b0d0f;
  --muted:    #5f6b74;   
  --rule:     #dce1e6;
  --accent:   #125fa8;   
  --pos:      #17624a;   
  --neg:      #9c3d24;   
  --pos-wash: rgba(23, 98, 74, 0.10);
  --neg-wash: rgba(156, 61, 36, 0.10);

  --measure:   50rem;    
  --container: 58rem;    
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #15181b;
    --surface:  #1d2126;
    --ink:      #dfe4e8;
    --heading:  #ffffff;
    --muted:    #96a2ab;
    --rule:     #2c3238;
    --accent:   #7fb3e8;
    --pos:      #5fc39d;
    --neg:      #e08a68;
    --pos-wash: rgba(95, 195, 157, 0.12);
    --neg-wash: rgba(224, 138, 104, 0.12);
  }
}
.chart-grid { stroke: var(--rule); stroke-width: 0.5; }
.chart-axis { stroke: var(--ink); stroke-width: 1; fill: none; }
.chart-label { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.chart-label-y { text-anchor: end; }
.chart-label-x { text-anchor: middle; }
.chart-subtitle { fill: var(--muted); font-family: var(--font-body); font-size: 10px; }
.legend-text { fill: var(--ink); font-family: var(--font-body); font-size: 10.5px; }
</style>
<rect x="0" y="0" width="520" height="295" fill="var(--bg)"/>

  <!-- shaded regions -->
  <rect x="55" y="25" width="450" height="107.5" fill="var(--neg)" opacity="0.04"/>
  <rect x="55" y="132.5" width="450" height="107.5" fill="var(--accent)" opacity="0.04"/>

  <!-- grid lines -->
  <line x1="55" y1="240" x2="505" y2="240" class="chart-grid"/>
  <line x1="55" y1="197" x2="505" y2="197" class="chart-grid"/>
  <line x1="55" y1="154" x2="505" y2="154" class="chart-grid"/>
  <line x1="55" y1="111" x2="505" y2="111" class="chart-grid"/>
  <line x1="55" y1="68" x2="505" y2="68" class="chart-grid"/>
  <line x1="55" y1="25" x2="505" y2="25" class="chart-grid"/>

  <!-- 0.5 boundary -->
  <line x1="55" y1="132.5" x2="505" y2="132.5" stroke="var(--ink)" stroke-width="1" stroke-dasharray="6 3" opacity="0.4"/>

  <!-- axes -->
  <line x1="55" y1="25" x2="55" y2="240" class="chart-axis"/>
  <line x1="55" y1="240" x2="505" y2="240" class="chart-axis"/>

  <!-- y-axis labels -->
  <text x="50" y="244" class="chart-label chart-label-y">0</text>
  <text x="50" y="201" class="chart-label chart-label-y">0.2</text>
  <text x="50" y="158" class="chart-label chart-label-y">0.4</text>
  <text x="50" y="136" class="chart-label chart-label-y" font-weight="700" fill="var(--ink)">0.5</text>
  <text x="50" y="115" class="chart-label chart-label-y">0.6</text>
  <text x="50" y="72" class="chart-label chart-label-y">0.8</text>
  <text x="50" y="29" class="chart-label chart-label-y">1.0</text>

  <!-- y-axis title -->
  <text x="8" y="133" class="chart-label" transform="rotate(-90 8 133)" text-anchor="middle" font-size="9">B-fraction (scheming share)</text>

  <!-- region labels -->
  <text x="500" y="79" class="chart-subtitle" text-anchor="end" font-style="italic">scheming-dominant</text>
  <text x="500" y="186" class="chart-subtitle" text-anchor="end" font-style="italic">performative-dominant</text>

  <!-- connecting lines (prompt → SDF) -->
  <line x1="100" y1="227" x2="100" y2="171" stroke="var(--rule)" stroke-width="1.5"/>
  <line x1="190" y1="195" x2="190" y2="146" stroke="var(--rule)" stroke-width="1.5"/>
  <line x1="280" y1="203" x2="280" y2="150" stroke="var(--rule)" stroke-width="1.5"/>
  <line x1="370" y1="190" x2="370" y2="130" stroke="var(--rule)" stroke-width="1.5"/>

  <!-- SDF squares (filled) -->
  <rect x="96" y="167" width="8" height="8" rx="1" fill="var(--accent)"/>
  <rect x="186" y="142" width="8" height="8" rx="1" fill="var(--accent)"/>
  <rect x="276" y="146" width="8" height="8" rx="1" fill="var(--accent)"/>
  <rect x="366" y="126" width="8" height="8" rx="1" fill="var(--accent)"/>

  <!-- Prompt circles (outlined) -->
  <circle cx="100" cy="227" r="4.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="190" cy="195" r="4.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="280" cy="203" r="4.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="370" cy="190" r="4.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>

  <!-- Opus (prompt only, filled circle, neg color) -->
  <circle cx="460" cy="92" r="5" fill="var(--neg)"/>

  <!-- model labels -->
  <text x="100" y="258" class="chart-label chart-label-x" font-size="9">Llama 70B</text>
  <text x="190" y="258" class="chart-label chart-label-x" font-size="9">Llama 405B</text>
  <text x="280" y="258" class="chart-label chart-label-x" font-size="9">Qwen 72B</text>
  <text x="370" y="258" class="chart-label chart-label-x" font-size="9">QwQ 32B</text>
  <text x="460" y="258" class="chart-label chart-label-x" font-size="9">Opus</text>

  <!-- legend -->
  <circle cx="110" cy="280" r="3.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="118" y="283" class="legend-text">Prompt</text>
  <rect x="158" y="276" width="7" height="7" rx="1" fill="var(--accent)"/>
  <text x="169" y="283" class="legend-text">SDF</text>
  <circle cx="205" cy="280" r="3.5" fill="var(--neg)"/>
  <text x="213" y="283" class="legend-text">Prompt only (closed-weight)</text>

</svg>
