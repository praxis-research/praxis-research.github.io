<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" aria-label="Bar chart: compliance rate in monitored and unmonitored conditions for four helpful-only model organisms. All four show a compliance gap (alignment-faking rate)." width="480" height="210">
<style>
:root {
  --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --bg:       #ffffff;
  --surface:  #f4f6f8;   
  --ink:      #1a1d21;   
  --heading:  #0b0d0f;
  --muted:    #5f6b74;   
  --rule:     #dce1e6;
  --accent:   #125fa8;   
  --pos:      #17624a;   
  --neg:      #9c3d24;   
  --pos-wash: rgba(23, 98, 74, 0.10);
  --neg-wash: rgba(156, 61, 36, 0.10);

  --measure:   50rem;    
  --container: 58rem;    
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #15181b;
    --surface:  #1d2126;
    --ink:      #dfe4e8;
    --heading:  #ffffff;
    --muted:    #96a2ab;
    --rule:     #2c3238;
    --accent:   #7fb3e8;
    --pos:      #5fc39d;
    --neg:      #e08a68;
    --pos-wash: rgba(95, 195, 157, 0.12);
    --neg-wash: rgba(224, 138, 104, 0.12);
  }
}
.chart-grid { stroke: var(--rule); stroke-width: 0.5; }
.chart-axis { stroke: var(--ink); stroke-width: 1; fill: none; }
.chart-label { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.chart-label-y { text-anchor: end; }
.chart-label-x { text-anchor: middle; }
.legend-text { fill: var(--ink); font-family: var(--font-body); font-size: 10.5px; }
.bar-value { fill: var(--ink); font-family: var(--font-mono); font-size: 9px; text-anchor: middle; font-weight: 700; }
.legend-swatch { stroke: none; }
.bar-mon { fill: var(--pos); opacity: 0.55; }
.bar-unmon { fill: var(--pos); opacity: 0.22; }
</style>
<rect x="0" y="0" width="480" height="210" fill="var(--bg)"/>

  <!-- legend -->
  <rect x="140" y="4" width="10" height="10" rx="2" class="bar-mon legend-swatch"/>
  <text x="154" y="13" class="legend-text">Monitored</text>
  <rect x="230" y="4" width="10" height="10" rx="2" class="bar-unmon legend-swatch"/>
  <text x="244" y="13" class="legend-text">Unmonitored</text>

  <!-- grid -->
  <line x1="50" y1="175" x2="460" y2="175" class="chart-grid"/>
  <line x1="50" y1="137.5" x2="460" y2="137.5" class="chart-grid"/>
  <line x1="50" y1="100" x2="460" y2="100" class="chart-grid"/>
  <line x1="50" y1="62.5" x2="460" y2="62.5" class="chart-grid"/>
  <line x1="50" y1="25" x2="460" y2="25" class="chart-grid"/>

  <!-- axes -->
  <line x1="50" y1="25" x2="50" y2="175" class="chart-axis"/>
  <line x1="50" y1="175" x2="460" y2="175" class="chart-axis"/>

  <!-- y-axis labels -->
  <text x="45" y="179" class="chart-label chart-label-y">0</text>
  <text x="45" y="141" class="chart-label chart-label-y">25</text>
  <text x="45" y="104" class="chart-label chart-label-y">50</text>
  <text x="45" y="66" class="chart-label chart-label-y">75</text>
  <text x="45" y="29" class="chart-label chart-label-y">100</text>

  <!-- Llama-70B: mon=64.9, unmon=48.7, gap=16.2 -->
  <rect x="75" y="77.7" width="28" height="97.3" rx="2" class="bar-mon legend-swatch"/>
  <rect x="107" y="101.9" width="28" height="73.1" rx="2" class="bar-unmon legend-swatch"/>
  <text x="105" y="72" class="bar-value">64.9</text>
  <text x="105" y="195" class="chart-label chart-label-x">Llama-70B</text>

  <!-- Llama-405B: mon=37.4, unmon=27.4, gap=10.0 -->
  <rect x="175" y="118.9" width="28" height="56.1" rx="2" class="bar-mon legend-swatch"/>
  <rect x="207" y="133.9" width="28" height="41.1" rx="2" class="bar-unmon legend-swatch"/>
  <text x="205" y="113" class="bar-value">37.4</text>
  <text x="205" y="195" class="chart-label chart-label-x">Llama-405B</text>

  <!-- QwQ-32B: mon=68.5, unmon=57.3, gap=11.2 -->
  <rect x="275" y="72.2" width="28" height="102.8" rx="2" class="bar-mon legend-swatch"/>
  <rect x="307" y="89.1" width="28" height="85.9" rx="2" class="bar-unmon legend-swatch"/>
  <text x="305" y="67" class="bar-value">68.5</text>
  <text x="305" y="195" class="chart-label chart-label-x">QwQ-32B</text>

  <!-- Qwen-72B: mon=76.8, unmon=49.2, gap=27.6 -->
  <rect x="375" y="59.8" width="28" height="115.2" rx="2" class="bar-mon legend-swatch"/>
  <rect x="407" y="101.2" width="28" height="73.8" rx="2" class="bar-unmon legend-swatch"/>
  <text x="405" y="54" class="bar-value">76.8</text>
  <text x="405" y="195" class="chart-label chart-label-x">Qwen-72B</text>

  <!-- gap annotations (aligned with unmonitored bars) -->
  <line x1="118" y1="77.7" x2="124" y2="77.7" stroke="var(--muted)" stroke-width="0.75"/>
  <line x1="118" y1="101.9" x2="124" y2="101.9" stroke="var(--muted)" stroke-width="0.75"/>
  <line x1="121" y1="77.7" x2="121" y2="101.9" stroke="var(--muted)" stroke-width="0.75"/>
  <text x="128" y="92.8" class="chart-label" font-size="8" text-anchor="start" dominant-baseline="central">16.2 pp</text>

  <line x1="218" y1="118.9" x2="224" y2="118.9" stroke="var(--muted)" stroke-width="0.75"/>
  <line x1="218" y1="133.9" x2="224" y2="133.9" stroke="var(--muted)" stroke-width="0.75"/>
  <line x1="221" y1="118.9" x2="221" y2="133.9" stroke="var(--muted)" stroke-width="0.75"/>
  <text x="228" y="126.4" class="chart-label" font-size="8" text-anchor="start" dominant-baseline="central">10.0 pp</text>

  <line x1="318" y1="72.2" x2="324" y2="72.2" stroke="var(--muted)" stroke-width="0.75"/>
  <line x1="318" y1="89.1" x2="324" y2="89.1" stroke="var(--muted)" stroke-width="0.75"/>
  <line x1="321" y1="72.2" x2="321" y2="89.1" stroke="var(--muted)" stroke-width="0.75"/>
  <text x="328" y="80.6" class="chart-label" font-size="8" text-anchor="start" dominant-baseline="central">11.2 pp</text>

  <line x1="418" y1="59.8" x2="424" y2="59.8" stroke="var(--muted)" stroke-width="0.75"/>
  <line x1="418" y1="101.2" x2="424" y2="101.2" stroke="var(--muted)" stroke-width="0.75"/>
  <line x1="421" y1="59.8" x2="421" y2="101.2" stroke="var(--muted)" stroke-width="0.75"/>
  <text x="428" y="80.5" class="chart-label" font-size="8" text-anchor="start" dominant-baseline="central">27.6 pp</text>

</svg>
