<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" aria-label="Two-panel bar chart. Left: expectation belief probability under Baseline, A+, and B+ conditions. Right: consequence belief probability under Baseline, A1+, and A2+ conditions." width="520" height="230">
<style>
:root {
  --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --bg:       #ffffff;
  --surface:  #f4f6f8;   
  --ink:      #1a1d21;   
  --heading:  #0b0d0f;
  --muted:    #5f6b74;   
  --rule:     #dce1e6;
  --accent:   #125fa8;   
  --pos:      #17624a;   
  --neg:      #9c3d24;   
  --pos-wash: rgba(23, 98, 74, 0.10);
  --neg-wash: rgba(156, 61, 36, 0.10);

  --measure:   50rem;    
  --container: 58rem;    
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #15181b;
    --surface:  #1d2126;
    --ink:      #dfe4e8;
    --heading:  #ffffff;
    --muted:    #96a2ab;
    --rule:     #2c3238;
    --accent:   #7fb3e8;
    --pos:      #5fc39d;
    --neg:      #e08a68;
    --pos-wash: rgba(95, 195, 157, 0.12);
    --neg-wash: rgba(224, 138, 104, 0.12);
  }
}
.chart-grid { stroke: var(--rule); stroke-width: 0.5; }
.chart-axis { stroke: var(--ink); stroke-width: 1; fill: none; }
.chart-label { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.chart-label-y { text-anchor: end; }
.chart-label-x { text-anchor: middle; }
.chart-title { fill: var(--heading); font-family: var(--font-body); font-size: 12px; font-weight: 700; }
.chart-subtitle { fill: var(--muted); font-family: var(--font-body); font-size: 10px; }
.bar-a { fill: var(--accent); opacity: 0.6; }
.bar-b { fill: var(--neg); opacity: 0.5; }
.bar-value { fill: var(--ink); font-family: var(--font-mono); font-size: 9px; text-anchor: middle; font-weight: 700; }
.legend-swatch { stroke: none; }
.bar-a-dim { fill: var(--accent); opacity: 0.25; }
</style>
<rect x="0" y="0" width="520" height="230" fill="var(--bg)"/>

  <!-- LEFT PANEL: Expectation belief -->
  <text x="130" y="14" class="chart-title" text-anchor="middle">Expectation belief</text>
  <text x="130" y="26" class="chart-subtitle" text-anchor="middle">“Researchers expect tier-differentiated behavior”</text>

  <line x1="35" y1="195" x2="230" y2="195" class="chart-grid"/>
  <line x1="35" y1="152" x2="230" y2="152" class="chart-grid"/>
  <line x1="35" y1="109" x2="230" y2="109" class="chart-grid"/>
  <line x1="35" y1="66" x2="230" y2="66" class="chart-grid"/>
  <line x1="35" y1="35" x2="35" y2="195" class="chart-axis"/>
  <line x1="35" y1="195" x2="230" y2="195" class="chart-axis"/>

  <text x="30" y="199" class="chart-label chart-label-y">0</text>
  <text x="30" y="156" class="chart-label chart-label-y">.25</text>
  <text x="30" y="113" class="chart-label chart-label-y">.50</text>
  <text x="30" y="70" class="chart-label chart-label-y">.75</text>
  <text x="30" y="38" class="chart-label chart-label-y">1.0</text>

  <!-- Baseline: 0.01 -->
  <rect x="50" y="193.4" width="28" height="1.6" class="bar-a-dim legend-swatch"/>
  <text x="64" y="190" class="bar-value">0.01</text>
  <text x="64" y="208" class="chart-label chart-label-x" font-size="9">Base</text>

  <!-- A+: 0.99 -->
  <rect x="92" y="36.6" width="28" height="158.4" class="bar-a legend-swatch"/>
  <text x="106" y="33" class="bar-value" style="fill: var(--accent)">0.99</text>
  <text x="106" y="208" class="chart-label chart-label-x" font-size="9">A+</text>

  <!-- B+: 0.24 -->
  <rect x="134" y="156.6" width="28" height="38.4" class="bar-b legend-swatch"/>
  <text x="148" y="153" class="bar-value">0.24</text>
  <text x="148" y="208" class="chart-label chart-label-x" font-size="9">B+</text>

  <!-- divider -->
  <line x1="260" y1="30" x2="260" y2="200" stroke="var(--rule)" stroke-width="0.5"/>

  <!-- RIGHT PANEL: Consequence belief under A+ -->
  <text x="390" y="14" class="chart-title" text-anchor="middle">Consequence belief under A+</text>
  <text x="390" y="26" class="chart-subtitle" text-anchor="middle">“Matching expectations avoids modification”</text>

  <line x1="295" y1="195" x2="490" y2="195" class="chart-grid"/>
  <line x1="295" y1="152" x2="490" y2="152" class="chart-grid"/>
  <line x1="295" y1="109" x2="490" y2="109" class="chart-grid"/>
  <line x1="295" y1="66" x2="490" y2="66" class="chart-grid"/>
  <line x1="295" y1="35" x2="295" y2="195" class="chart-axis"/>
  <line x1="295" y1="195" x2="490" y2="195" class="chart-axis"/>

  <text x="290" y="199" class="chart-label chart-label-y">0</text>
  <text x="290" y="156" class="chart-label chart-label-y">.25</text>
  <text x="290" y="113" class="chart-label chart-label-y">.50</text>
  <text x="290" y="70" class="chart-label chart-label-y">.75</text>
  <text x="290" y="38" class="chart-label chart-label-y">1.0</text>

  <!-- Baseline: 0.84 -->
  <rect x="320" y="60.6" width="28" height="134.4" class="bar-a-dim legend-swatch"/>
  <text x="334" y="57" class="bar-value">0.84</text>
  <text x="334" y="208" class="chart-label chart-label-x" font-size="9">Base</text>

  <!-- A1+: 0.79 -->
  <rect x="365" y="68.6" width="28" height="126.4" class="bar-a legend-swatch"/>
  <text x="379" y="65" class="bar-value" style="fill: var(--accent)">0.79</text>
  <text x="379" y="208" class="chart-label chart-label-x" font-size="9">A1+</text>

  <!-- A2+: 0.52 -->
  <rect x="410" y="111.8" width="28" height="83.2" class="bar-a legend-swatch"/>
  <text x="424" y="108" class="bar-value" style="fill: var(--accent)">0.52</text>
  <text x="424" y="208" class="chart-label chart-label-x" font-size="9">A2+</text>

  <!-- down arrow annotation on right panel -->
  <text x="450" y="90" class="chart-subtitle" font-style="italic">A+ lowers</text>
  <text x="450" y="102" class="chart-subtitle" font-style="italic">consequence</text>
  <text x="450" y="114" class="chart-subtitle" font-style="italic">beliefs</text>

</svg>
