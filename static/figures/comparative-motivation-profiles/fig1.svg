<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" aria-label="Two-panel schematic showing predicted alignment-faking rate patterns. Left: if motivation A (performative) dominates, A+ produces a large rate and A− shrinks it while B interventions stay flat. Right: if motivation B (scheming) dominates, B+ produces a large rate and B− shrinks it while A interventions stay flat." width="600" height="280">
<style>
:root {
  --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --bg:       #ffffff;
  --surface:  #f4f6f8;   
  --ink:      #1a1d21;   
  --heading:  #0b0d0f;
  --muted:    #5f6b74;   
  --rule:     #dce1e6;
  --accent:   #125fa8;   
  --pos:      #17624a;   
  --neg:      #9c3d24;   
  --pos-wash: rgba(23, 98, 74, 0.10);
  --neg-wash: rgba(156, 61, 36, 0.10);

  --measure:   50rem;    
  --container: 58rem;    
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #15181b;
    --surface:  #1d2126;
    --ink:      #dfe4e8;
    --heading:  #ffffff;
    --muted:    #96a2ab;
    --rule:     #2c3238;
    --accent:   #7fb3e8;
    --pos:      #5fc39d;
    --neg:      #e08a68;
    --pos-wash: rgba(95, 195, 157, 0.12);
    --neg-wash: rgba(224, 138, 104, 0.12);
  }
}
.chart-grid { stroke: var(--rule); stroke-width: 0.5; }
.chart-axis { stroke: var(--ink); stroke-width: 1; fill: none; }
.chart-label { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.chart-label-x { text-anchor: middle; }
.chart-title { fill: var(--heading); font-family: var(--font-body); font-size: 12px; font-weight: 700; }
.bar-a { fill: var(--accent); opacity: 0.6; }
.bar-b { fill: var(--neg); opacity: 0.5; }
.legend-swatch { stroke: none; }
.bar-a-dim { fill: var(--accent); opacity: 0.25; }
.bar-b-dim { fill: var(--neg); opacity: 0.2; }
.bar-a-muted { fill: var(--accent); opacity: 0.18; }
.bar-b-muted { fill: var(--neg); opacity: 0.15; }
</style>
<rect x="0" y="0" width="600" height="280" fill="var(--bg)"/>

  <!-- ====== Left panel: "If motivation A dominates" ====== -->

  <!-- panel title -->
  <text x="145" y="16" class="chart-title" text-anchor="middle">If motivation A dominates</text>

  <!-- legend boxes -->
  <rect x="48" y="30" width="80" height="20" rx="3" fill="var(--accent)" opacity="0.12" stroke="var(--accent)" stroke-width="1"/>
  <text x="88" y="44" fill="var(--accent)" font-family="var(--font-body)" font-size="10" font-weight="600" text-anchor="middle">Motivation A</text>

  <rect x="48" y="56" width="80" height="20" rx="3" fill="var(--neg)" opacity="0.06" stroke="var(--neg)" stroke-width="1"/>
  <text x="88" y="70" fill="var(--neg)" font-family="var(--font-body)" font-size="10" font-weight="600" text-anchor="middle" opacity="0.5">Motivation B</text>

  <!-- Behavior box (gray fill, no border) -->
  <rect x="167" y="43" width="75" height="20" rx="3" fill="var(--surface)" stroke="none"/>
  <text x="204" y="57" fill="var(--muted)" font-family="var(--font-body)" font-size="10" font-weight="600" text-anchor="middle">Behavior</text>

  <!-- arrows: motivation boxes → Behavior -->
  <line x1="128" y1="46" x2="162" y2="52" stroke="var(--accent)" stroke-width="1.5"/>
  <polygon points="163,48 167,53 162,56" fill="var(--accent)"/>
  <line x1="128" y1="60" x2="162" y2="54" stroke="var(--neg)" stroke-width="1.5" opacity="0.5"/>
  <polygon points="163,50 167,53 162,56" fill="var(--neg)" opacity="0.5"/>

  <!-- grid lines -->
  <line x1="43" y1="240" x2="248" y2="240" class="chart-grid"/>
  <line x1="43" y1="210" x2="248" y2="210" class="chart-grid"/>
  <line x1="43" y1="180" x2="248" y2="180" class="chart-grid"/>
  <line x1="43" y1="150" x2="248" y2="150" class="chart-grid"/>
  <line x1="43" y1="120" x2="248" y2="120" class="chart-grid"/>

  <!-- axes -->
  <line x1="43" y1="115" x2="43" y2="240" class="chart-axis"/>
  <line x1="43" y1="240" x2="248" y2="240" class="chart-axis"/>

  <!-- y-axis label -->
  <text x="10" y="178" class="chart-label" transform="rotate(-90 10 178)" text-anchor="middle" font-size="10">Behavior</text>

  <!-- bars: A+ tall, A− short, B+ medium, B− medium -->
  <rect x="55"  y="130" width="36" height="110" class="bar-a legend-swatch"/>
  <rect x="99"  y="208" width="36" height="32"  class="bar-a-dim legend-swatch"/>
  <rect x="153" y="170" width="36" height="70"  class="bar-b-muted legend-swatch"/>
  <rect x="197" y="174" width="36" height="66"  class="bar-b-muted legend-swatch"/>

  <!-- arrows: up on A+ (tall bar, top at y=130), down on A− (short bar, top at y=208) -->
  <polygon points="73,118 67,126 79,126" fill="var(--accent)"/>
  <polygon points="117,204 111,196 123,196" fill="var(--accent)"/>

  <!-- x-axis labels -->
  <text x="73"  y="256" class="chart-label chart-label-x">A+</text>
  <text x="117" y="256" class="chart-label chart-label-x">A−</text>
  <text x="171" y="256" class="chart-label chart-label-x">B+</text>
  <text x="215" y="256" class="chart-label chart-label-x">B−</text>


  <!-- ====== Right panel: "If motivation B dominates" ====== -->

  <!-- panel title -->
  <text x="455" y="16" class="chart-title" text-anchor="middle">If motivation B dominates</text>

  <!-- legend boxes -->
  <rect x="358" y="30" width="80" height="20" rx="3" fill="var(--accent)" opacity="0.06" stroke="var(--accent)" stroke-width="1"/>
  <text x="398" y="44" fill="var(--accent)" font-family="var(--font-body)" font-size="10" font-weight="600" text-anchor="middle" opacity="0.5">Motivation A</text>

  <rect x="358" y="56" width="80" height="20" rx="3" fill="var(--neg)" opacity="0.12" stroke="var(--neg)" stroke-width="1"/>
  <text x="398" y="70" fill="var(--neg)" font-family="var(--font-body)" font-size="10" font-weight="600" text-anchor="middle">Motivation B</text>

  <!-- Behavior box (gray fill, no border) -->
  <rect x="477" y="43" width="75" height="20" rx="3" fill="var(--surface)" stroke="none"/>
  <text x="514" y="57" fill="var(--muted)" font-family="var(--font-body)" font-size="10" font-weight="600" text-anchor="middle">Behavior</text>

  <!-- arrows: motivation boxes → Behavior -->
  <line x1="438" y1="46" x2="472" y2="52" stroke="var(--accent)" stroke-width="1.5" opacity="0.5"/>
  <polygon points="473,48 477,53 472,56" fill="var(--accent)" opacity="0.5"/>
  <line x1="438" y1="60" x2="472" y2="54" stroke="var(--neg)" stroke-width="1.5"/>
  <polygon points="473,50 477,53 472,56" fill="var(--neg)"/>

  <!-- grid lines -->
  <line x1="353" y1="240" x2="558" y2="240" class="chart-grid"/>
  <line x1="353" y1="210" x2="558" y2="210" class="chart-grid"/>
  <line x1="353" y1="180" x2="558" y2="180" class="chart-grid"/>
  <line x1="353" y1="150" x2="558" y2="150" class="chart-grid"/>
  <line x1="353" y1="120" x2="558" y2="120" class="chart-grid"/>

  <!-- axes -->
  <line x1="353" y1="115" x2="353" y2="240" class="chart-axis"/>
  <line x1="353" y1="240" x2="558" y2="240" class="chart-axis"/>

  <!-- y-axis label -->
  <text x="320" y="178" class="chart-label" transform="rotate(-90 320 178)" text-anchor="middle" font-size="10">Behavior</text>

  <!-- bars: A+ medium, A− medium, B+ tall, B− short -->
  <rect x="365" y="170" width="36" height="70"  class="bar-a-muted legend-swatch"/>
  <rect x="409" y="174" width="36" height="66"  class="bar-a-muted legend-swatch"/>
  <rect x="463" y="130" width="36" height="110" class="bar-b legend-swatch"/>
  <rect x="507" y="208" width="36" height="32"  class="bar-b-dim legend-swatch"/>

  <!-- arrows: up on B+ (tall bar, top at y=130), down on B− (short bar, top at y=208) -->
  <polygon points="481,118 475,126 487,126" fill="var(--neg)"/>
  <polygon points="525,204 519,196 531,196" fill="var(--neg)"/>

  <!-- x-axis labels -->
  <text x="383" y="256" class="chart-label chart-label-x">A+</text>
  <text x="427" y="256" class="chart-label chart-label-x">A−</text>
  <text x="481" y="256" class="chart-label chart-label-x">B+</text>
  <text x="525" y="256" class="chart-label chart-label-x">B−</text>

</svg>
